name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install (CPU PyTorch)
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements-dev.txt
          pip install --no-deps -e .
      - name: Lint
        run: ruff check truth_engine scripts tests
      - name: Tests (fast config; model-dependent tests skip without downloaded models)
        env:
          TE_NO_DOTENV: "1"
        run: pytest -q
